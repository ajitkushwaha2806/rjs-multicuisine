<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#EBE5D8"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2DDD0" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Outer Pattern -->
  <circle cx="400" cy="270" r="180" fill="url(#circleGrad)" stroke="#14532D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="400" cy="270" r="150" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Food Cloche / Covered Dish Icon -->
  <g transform="translate(400, 260) scale(1.15)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="50" rx="90" ry="14" fill="#0F3D24" opacity="0.12"/>
    <path d="M-80 44 L80 44 C82 44 84 46 82 48 C70 54 -70 54 -82 48 C-84 46 -82 44 -80 44 Z" fill="#D4AF37"/>

    <!-- Cloche Dome -->
    <path d="M-70 40 C-68 -25 68 -25 70 40 Z" fill="#14532D"/>

    <!-- Cloche Ring & Highlight -->
    <path d="M-66 38 C-64 -20 64 -20 66 38" fill="none" stroke="#22C55E" stroke-width="2" opacity="0.4"/>

    <!-- Top Handle Knob -->
    <circle cx="0" cy="-35" r="9" fill="#D4AF37"/>
    <path d="M-3 -26 L3 -26 L2 -18 L-2 -18 Z" fill="#D4AF37"/>

    <!-- Aroma Steam Lines -->
    <path d="M-22 -44 C-26 -56 -18 -64 -22 -74" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 -48 C-4 -62 4 -72 0 -84" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M22 -44 C18 -56 26 -64 22 -74" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="410" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#0A2918" letter-spacing="1">
    RJ'S MULTICUISINE
  </text>
  <text x="400" y="440" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#15803D" letter-spacing="3">
    100% PURE VEG • FRESHLY COOKED TO ORDER
  </text>
</svg>
